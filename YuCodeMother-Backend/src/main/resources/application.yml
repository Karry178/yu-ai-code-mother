spring:
  application:
    name: YuCodeMother-Backend
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.1.128:3306/yu_ai_code_mother
    username: root
    password: 123456
  # Redis
  data:
    redis:
      host: 192.168.1.128  # 本地开发使用 localhost，生产环境使用实际 IP
      port: 6379
      username: default
      password: 123456
      timeout: 5000  # 连接超时时间（毫秒）
      ttl: 3600  # 过期时间
  # session 配置
  session:
    store-type: redis
    # session 30天过期
    timeout: 2592000
  # 当前生效的配置文件 - local
  profiles:
    active: local

server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi项目配置
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yupi.yucodemotherbackend.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

# LangChain4j Redis Chat Memory Store 配置
langchain4j:
  open-ai:
    # 普通模型输出
    chat-model:
      base-url: https://api.deepseek.com
      api-key: <Your API Key>
      model-name: deepseek-chat
      ## 结构化输出的优化技巧
      # 1.设置max_tokens
      max-tokens: 8192
      # 2.JSON Schema配置：严格确保【结构化输出】生效，DS不支持这个功能，但是有类似的配置 - 设置response-format参数为json_object
#      strict-json-schema: true
#      response-format: json_object
      log-requests: true
      log-responses: true
    # 流式对象输出
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: <Your API Key>
      model-name: deepseek-chat
      max-tokens: 8192
      log-requests: true
      log-responses: true


## 添加 COS 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: your-custom-domain.com
    secretId: your-secret-id
    secretKey: your-secret-key
    region: ap-shanghai
    bucket: your-bucket-name

# Pexels 图片搜索配置
pexels:
  api-key: <Your API Key>

# 阿里云 DashScope 配置
dashscope:
  api-key: <Your API Key>
  image-model: wan2.2-t2i-flash
